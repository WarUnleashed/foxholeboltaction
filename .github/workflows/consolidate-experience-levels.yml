name: Consolidate Colonial unit experience levels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/consolidate-experience-levels.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild Colonial units as single entries with experience choices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import re
          import uuid
          import xml.etree.ElementTree as ET

          CAT='Colonial Legion.cat'
          WARDEN='Warden Army.cat'
          GST='Bolt Action - Foxhole.gst'
          IDX='index.xml'
          REV='17'
          NS='http://www.battlescribe.net/schema/catalogueSchema'
          q=lambda t:f'{{{NS}}}{t}'
          U=uuid.UUID('6b0b6908-2d5f-4b1a-8f8b-a8d28bcbdf41')

          exp_re=re.compile(r'\s*\((Inexperienced|Regular|Veteran)\)\s*$', re.I)
          era_re=re.compile(r'\s*\(GREAT WAR ERA\)\s*', re.I)
          generic_infantry={
              'RECRUIT SQUAD':'INFANTRY SQUAD',
              'REGULAR INFANTRY SQUAD':'INFANTRY SQUAD',
              'VETERAN INFANTRY SQUAD':'INFANTRY SQUAD',
          }
          exp_order=['Inexperienced','Regular','Veteran']

          def expof(name):
              m=exp_re.search(name or '')
              return m.group(1).title() if m else None

          def family_name(name):
              s=exp_re.sub('', name or '').strip()
              s=era_re.sub('', s).strip()
              return generic_infantry.get(s.upper(), s)

          def is_gw(name):
              return bool(era_re.search(name or ''))

          def constraint(kind, value, seed):
              return ET.Element(q('constraint'), {
                  'field':'selections','scope':'parent','value':str(value),
                  'percentValue':'false','shared':'false',
                  'includeChildSelections':'false','includeChildForces':'false',
                  'type':kind,'id':str(uuid.uuid5(U, seed))
              })

          tree=ET.parse(CAT)
          root=tree.getroot()
          top=root.find(q('selectionEntries'))
          if top is None:
              raise SystemExit('Colonial catalogue has no top-level selectionEntries')

          # Gather every legacy top-level experience variant. When modern and Great War
          # copies describe the same family/experience, prefer the non-Great-War copy.
          families={}
          all_variants={}
          for entry in list(top):
              if entry.tag != q('selectionEntry') or entry.get('type') != 'unit':
                  continue
              xp=expof(entry.get('name',''))
              if not xp:
                  continue
              fam=family_name(entry.get('name',''))
              all_variants.setdefault(fam, []).append(entry)
              old=families.setdefault(fam, {}).get(xp)
              if old is None or (is_gw(old.get('name','')) and not is_gw(entry.get('name',''))):
                  families[fam][xp]=entry

          old_to_parent={}
          stale_wrapper_ids={}
          rebuilt=0

          for fam, variants in families.items():
              matches=all_variants.get(fam, [])
              if not matches:
                  continue

              # Also remove revision-14 wrapper units for this same family. Those wrappers
              # are the reason New Recruit continued to surface old experience entries.
              wrappers=[]
              for entry in list(top):
                  if entry.tag != q('selectionEntry') or entry.get('type') != 'unit' or expof(entry.get('name','')):
                      continue
                  if family_name(entry.get('name','')) != fam:
                      continue
                  groups=entry.findall('.//'+q('selectionEntryGroup'))
                  if any((g.get('name') or '').startswith('Experience') for g in groups):
                      wrappers.append(entry)

              positions=[list(top).index(e) for e in matches+wrappers if e in list(top)]
              pos=min(positions) if positions else len(list(top))
              template=variants.get('Regular') or variants.get('Inexperienced') or variants.get('Veteran')

              parent=ET.Element(q('selectionEntry'), {
                  'id':str(uuid.uuid5(U, 'single-unit:'+fam)),
                  'name':fam,
                  'hidden':'false','collective':'false','import':'true','type':'unit'
              })
              parent_id=parent.get('id')

              cats=template.find(q('categoryLinks'))
              if cats is not None:
                  parent.append(copy.deepcopy(cats))

              groups=ET.SubElement(parent, q('selectionEntryGroups'))
              group=ET.SubElement(groups, q('selectionEntryGroup'), {
                  'id':str(uuid.uuid5(U, fam+':experience-group')),
                  'name':'Experience (choose one)','hidden':'false'
              })
              cons=ET.SubElement(group, q('constraints'))
              cons.append(constraint('min',1,fam+':experience:min'))
              cons.append(constraint('max',1,fam+':experience:max'))
              choices=ET.SubElement(group, q('selectionEntries'))

              for xp in exp_order:
                  src=variants.get(xp)
                  if src is None:
                      continue
                  child=copy.deepcopy(src)
                  child.set('id',str(uuid.uuid5(U, fam+':experience:'+xp)))
                  child.set('name',xp)
                  child.set('hidden','false')
                  child.set('type','upgrade')
                  catlinks=child.find(q('categoryLinks'))
                  if catlinks is not None:
                      child.remove(catlinks)
                  child_constraints=child.find(q('constraints'))
                  if child_constraints is None:
                      child_constraints=ET.Element(q('constraints'))
                      child.insert(0, child_constraints)
                  child_constraints.append(constraint('max',1,fam+':'+xp+':max'))
                  choices.append(child)

              # Preserve all original points by leaving each original variant's <costs>
              # on its nested experience choice; the parent intentionally has no cost.
              for old in matches:
                  old_to_parent[old.get('id')]=parent_id
              for wrapper in wrappers:
                  stale_wrapper_ids[wrapper.get('id')]=parent_id

              for old in matches+wrappers:
                  if old in list(top):
                      top.remove(old)
              top.insert(pos, parent)
              rebuilt += 1

          redirect={**old_to_parent, **stale_wrapper_ids}

          # Any selector/transport link that used to target an experience-specific unit
          # now targets the single consolidated parent. Deduplicate links in each group.
          for links in root.iter(q('entryLinks')):
              for link in list(links):
                  target=link.get('targetId')
                  if target in redirect:
                      link.set('targetId', redirect[target])
                      # Find the consolidated unit name for this target.
                      target_entry=next((e for e in list(top) if e.get('id')==redirect[target]), None)
                      if target_entry is not None:
                          link.set('name', target_entry.get('name',''))
              seen=set()
              for link in list(links):
                  key=(link.get('targetId'), link.get('type'))
                  if key in seen:
                      links.remove(link)
                  else:
                      seen.add(key)

          # Sanity checks: generic infantry must be one entry with all three choices,
          # and no old generic experience-labelled infantry may remain at top level.
          infantry=[e for e in list(top) if e.tag==q('selectionEntry') and e.get('type')=='unit' and e.get('name')=='INFANTRY SQUAD']
          if len(infantry) != 1:
              raise SystemExit(f'Expected one INFANTRY SQUAD, found {len(infantry)}')
          xp_names={e.get('name') for e in infantry[0].findall('.//'+q('selectionEntryGroup')+'[@name="Experience (choose one)"]/'+q('selectionEntries')+'/'+q('selectionEntry'))}
          if xp_names != set(exp_order):
              raise SystemExit(f'INFANTRY SQUAD experience choices incorrect: {xp_names}')

          root.set('revision',REV)
          root.set('gameSystemRevision',REV)
          ET.register_namespace('',NS)
          tree.write(CAT,encoding='UTF-8',xml_declaration=True)

          # Keep the Warden catalogue, GST, and index revisions synchronized so New Recruit
          # cannot cache a mixed-revision repository.
          wt=ET.parse(WARDEN); wr=wt.getroot(); wr.set('revision',REV); wr.set('gameSystemRevision',REV)
          ET.register_namespace('',NS); wt.write(WARDEN,encoding='UTF-8',xml_declaration=True)

          G='http://www.battlescribe.net/schema/gameSystemSchema'
          gt=ET.parse(GST); gt.getroot().set('revision',REV)
          ET.register_namespace('',G); gt.write(GST,encoding='UTF-8',xml_declaration=True)

          I='http://www.battlescribe.net/schema/dataIndexSchema'
          it=ET.parse(IDX)
          for d in it.getroot().iter(f'{{{I}}}dataIndexEntry'):
              d.set('dataRevision',REV)
          ET.register_namespace('',I); it.write(IDX,encoding='UTF-8',xml_declaration=True)

          for p in (CAT,WARDEN,GST,IDX):
              ET.parse(p)
          print(f'Rebuilt {rebuilt} Colonial families at revision {REV}; redirected {len(redirect)} old targets')
          PY

      - name: Commit generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Colonial Legion.cat' 'Warden Army.cat' 'Bolt Action - Foxhole.gst' index.xml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Consolidate Colonial units and preserve experience costs'
            git push
          fi
