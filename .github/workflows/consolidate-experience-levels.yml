name: Consolidate Colonial unit experience levels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/consolidate-experience-levels.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Colonial units as single entries with experience choices
        run: |
          python3 - <<'PY'
          import copy, re, uuid, xml.etree.ElementTree as ET
          CAT='Colonial Legion.cat'; GST='Bolt Action - Foxhole.gst'; IDX='index.xml'; REV='15'
          NS='http://www.battlescribe.net/schema/catalogueSchema'; q=lambda t:f'{{{NS}}}{t}'
          U=uuid.UUID('6b0b6908-2d5f-4b1a-8f8b-a8d28bcbdf41')
          tree=ET.parse(CAT); root=tree.getroot(); top=root.find(q('selectionEntries'))
          exp_re=re.compile(r'\s*\((Inexperienced|Regular|Veteran)\)\s*$',re.I)
          era_re=re.compile(r'\s*\(GREAT WAR ERA\)\s*',re.I)
          exps=['Inexperienced','Regular','Veteran']
          def core(name): return era_re.sub('',exp_re.sub('',name)).strip()
          def expof(name):
              m=exp_re.search(name); return m.group(1).title() if m else None
          def is_gw(name): return bool(era_re.search(name))
          def constraint(kind,val,seed):
              return ET.Element(q('constraint'),{'field':'selections','scope':'parent','value':str(val),'percentValue':'false','shared':'false','includeChildSelections':'false','includeChildForces':'false','type':kind,'id':str(uuid.uuid5(U,seed))})
          # Gather visible/hidden legacy experience variants. Prefer modern over Great War when both exist.
          fam={}
          for e in list(top):
              if e.tag!=q('selectionEntry') or e.get('type')!='unit': continue
              xp=expof(e.get('name',''))
              if not xp: continue
              b=core(e.get('name','')); key=(b,xp)
              old=fam.setdefault(b,{}).get(xp)
              if old is None or (is_gw(old.get('name','')) and not is_gw(e.get('name',''))): fam[b][xp]=e
          rebuilt=0
          for b,variants in fam.items():
              # Remove every top-level experience/era duplicate for this core name.
              matches=[e for e in list(top) if e.tag==q('selectionEntry') and e.get('type')=='unit' and expof(e.get('name','')) and core(e.get('name',''))==b]
              if not matches: continue
              pos=min(list(top).index(e) for e in matches)
              template=variants.get('Regular') or variants.get('Inexperienced') or variants.get('Veteran')
              parent=copy.deepcopy(template)
              parent.set('id',str(uuid.uuid5(U,'single:'+b))); parent.set('name',b); parent.set('hidden','false')
              # Parent carries no base cost: the selected experience child carries the original unit cost.
              costs=parent.find(q('costs'))
              if costs is not None: parent.remove(costs)
              # Remove template-specific options/models; they live inside the chosen experience variant.
              for tag in ['selectionEntries','selectionEntryGroups','entryLinks','profiles','infoLinks','modifiers','modifierGroups']:
                  x=parent.find(q(tag))
                  if x is not None: parent.remove(x)
              groups=ET.SubElement(parent,q('selectionEntryGroups'))
              g=ET.SubElement(groups,q('selectionEntryGroup'),{'id':str(uuid.uuid5(U,b+':experience')),'name':'Experience','hidden':'false'})
              cs=ET.SubElement(g,q('constraints')); cs.append(constraint('min',1,b+':min')); cs.append(constraint('max',1,b+':max'))
              ses=ET.SubElement(g,q('selectionEntries'))
              for xp in exps:
                  src=variants.get(xp)
                  if src is None: continue
                  ch=copy.deepcopy(src); ch.set('id',str(uuid.uuid5(U,b+':'+xp)); ch.set('name',xp); ch.set('hidden','false'); ch.set('type','upgrade')
                  # Remove category links from nested experience choices.
                  c=ch.find(q('categoryLinks'))
                  if c is not None: ch.remove(c)
                  # Ensure each experience choice can only be selected once.
                  cc=ch.find(q('constraints'))
                  if cc is None: cc=ET.Element(q('constraints')); ch.insert(0,cc)
                  cc.append(constraint('max',1,b+':'+xp+':max'))
                  ses.append(ch)
              for e in matches: top.remove(e)
              top.insert(pos,parent); rebuilt+=1
          # Existing revision-14 wrapper entries are now obsolete; remove wrappers with Experience (choose one)
          # when another rebuilt unit with the same core name exists.
          names={e.get('name','') for e in top if e.tag==q('selectionEntry') and e.get('type')=='unit'}
          for e in list(top):
              if e.tag!=q('selectionEntry') or e.get('type')!='unit': continue
              gs=e.findall('.//'+q('selectionEntryGroup'))
              if any((x.get('name') or '')=='Experience (choose one)' for x in gs) and e.get('name','') in names:
                  # Keep new vehicle placeholders; only remove stale wrapper if it contains entryLinks to legacy units.
                  if any(x.find(q('entryLinks')) is not None for x in gs): top.remove(e)
          root.set('revision',REV); root.set('gameSystemRevision',REV); ET.register_namespace('',NS); tree.write(CAT,encoding='UTF-8',xml_declaration=True)
          G='http://www.battlescribe.net/schema/gameSystemSchema'; gt=ET.parse(GST); gt.getroot().set('revision',REV); ET.register_namespace('',G); gt.write(GST,encoding='UTF-8',xml_declaration=True)
          I='http://www.battlescribe.net/schema/dataIndexSchema'; it=ET.parse(IDX)
          for d in it.getroot().iter(f'{{{I}}}dataIndexEntry'): d.set('dataRevision',REV)
          ET.register_namespace('',I); it.write(IDX,encoding='UTF-8',xml_declaration=True)
          ET.parse(CAT); ET.parse(GST); ET.parse(IDX); print('rebuilt',rebuilt,'families at revision',REV)
          PY
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Colonial Legion.cat' 'Bolt Action - Foxhole.gst' index.xml
          if git diff --cached --quiet; then echo 'No generated changes.'; else git commit -m 'Fix Colonial experience selectors and points'; git push; fi
