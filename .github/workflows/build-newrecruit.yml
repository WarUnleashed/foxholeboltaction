name: Build New Recruit data

on:
  workflow_dispatch:
  push:
    paths:
      - 'build/**'
      - '.github/workflows/build-newrecruit.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild BattleScribe data files
        shell: bash
        run: |
          set -euo pipefail
          cat build/min_chunks/min_00.b64 build/min_chunks/min_01.b64 build/min_chunks/min_02.b64 build/min_chunks/min_03.b64 | base64 -d | gzip -d > 'Colonial Legion.cat'
          cat build/gst.b64 | base64 -d | gzip -d > 'Bolt Action - Foxhole.gst'
          python - <<'PY'
          import uuid
          import xml.etree.ElementTree as ET

          CAT_NS = 'http://www.battlescribe.net/schema/catalogueSchema'
          GST_NS = 'http://www.battlescribe.net/schema/gameSystemSchema'
          POINTS = 'b0e5f7a2-33c8-46ce-8f8f-148d8171da43'
          ET.register_namespace('', CAT_NS)

          def q(tag):
              return f'{{{CAT_NS}}}{tag}'

          def sid(*parts):
              return str(uuid.uuid5(uuid.UUID('6ba7b810-9dad-11d1-80b4-00c04fd430c8'), 'colonial-legion|' + '|'.join(map(str, parts))))

          def exp_from_name(n):
              s=n.lower()
              if 'inexperienced' in s: return 'Inexperienced'
              if 'veteran' in s: return 'Veteran'
              if 'regular' in s: return 'Regular'
              return None

          # Returns base models, max additional models, points/additional model.
          # Values are copied from Armies of the Colonial Legion Alpha 0.1.
          def squad_size_spec(name):
              n=name.lower(); gw='great war era' in n; exp=exp_from_name(n)
              if 'recruit squad' in n and gw: return (5,5,7)
              if 'regular infantry squad' in n and gw: return (5,5,10)
              if 'veteran infantry squad' in n and gw: return (5,5,13)
              if 'drafted squad' in n and gw: return (5,15,4)
              if 'republic rangers squad' in n and gw: return (2,8,15)
              if 'swords of maro squad' in n and gw: return (5,5,14)
              if 'recruit squad' in n and not gw: return (5,5,7)
              if 'regular infantry squad' in n and not gw: return (5,5,10)
              if 'veteran infantry squad' in n and not gw: return (5,5,13)
              if 'reconnaissance squad' in n: return (4,6,13 if exp=='Veteran' else 10)
              if 'engineer squad' in n: return (5,5,13)
              if 'marine squad' in n: return (5,5,13 if exp=='Veteran' else 10)
              if 'cavalry squad' in n: return (3,7,13 if exp=='Veteran' else 10)
              if 'paratrooper squad' in n: return (5,5,14)
              if 'drafted squad' in n and not gw: return (5,15,4)
              if 'partisan squad' in n:
                  return (4,6,7 if exp=='Inexperienced' else (14 if exp=='Veteran' else 10))
              if 'republic rangers squad' in n and not gw: return (2,8,15)
              if 'swords of maro squad' in n and not gw: return (5,5,14)
              return None

          # Each weapon tuple is (name, points, source maximum, is_additional_weapon).
          def weapon_spec(name):
              n=name.lower(); gw='great war era' in n
              officer=any(x in n for x in ['2nd lieutenant','1st lieutenant','captain','major'])
              observer='forward observer' in n
              if officer or observer:
                  return 'choose one weapon', [('Pistol',0,1,False),('Submachine gun',0,1,False),('Carbine',0,1,False),('Shotgun',0,1,False),('Assault rifle',0,1,False),('Volta Repeater',0,1,False)], 1
              if 'medic' in n:
                  return 'choose one weapon', [('Pistol',0,1,False),('Unarmed',0,1,False)], 1
              if 'recruit squad' in n and gw:
                  return 'base: Carbines', [('Volta Repeater',0,10,False),('NCO submachine gun',3,1,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'regular infantry squad' in n and gw:
                  return 'base: Carbines', [('Volta Repeater',0,10,False),('NCO submachine gun',3,1,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'veteran infantry squad' in n and gw:
                  return 'base: Carbines', [('Volta Repeater',0,10,False),('Submachine gun',3,3,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'drafted squad' in n and gw:
                  return 'base: Volta Repeaters', [('Carbine',0,20,False),('Light machine gun',20,1,False)], None
              if 'republic rangers squad' in n and gw:
                  return 'base: Carbines', [('Submachine gun',3,3,False),('Shotgun',3,4,False),('Volta Repeater',0,10,False),('Pistol',-3,1,False),('Malone light machine gun',20,1,False),('Grenade launcher (alongside rifle)',20,1,True)], None
              if 'swords of maro squad' in n and gw:
                  return 'base: Carbines', [('Submachine gun',3,3,False),('Shotgun',3,3,False),('Volta Repeater',0,10,False),('Pistol',-3,2,False),('Light machine gun',20,2,False)], None
              if 'recruit squad' in n and not gw:
                  return 'base: Carbines', [('NCO Volta Repeater',0,1,False),('NCO submachine gun',3,1,False),('Shotgun',3,2,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'regular infantry squad' in n and not gw:
                  return 'base: Carbines', [('Submachine gun',3,2,False),('Shotgun',3,3,False),('Volta Repeater',0,3,False),('Pistol',-3,1,False),('Light machine gun',20,1,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'veteran infantry squad' in n and not gw:
                  return 'base: Carbines', [('Submachine gun',3,7,False),('Shotgun',3,10,False),('Volta Repeater',0,10,False),('Pistol',-3,2,False),('Light machine gun',20,2,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'reconnaissance squad' in n:
                  return 'base: Carbines', [('Submachine gun',3,5,False),('Shotgun',3,5,False),('Assault rifle',5,3,False)], None
              if 'engineer squad' in n:
                  return 'base: Carbines', [('Submachine gun',3,7,False),('Shotgun',3,10,False),('Assault rifle',5,7,False),('Volta Repeater',0,10,False),('Pistol',-3,2,False),('Light machine gun',20,1,False),('Flamethrower',20,1,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'marine squad' in n:
                  return 'base: Carbines', [('Submachine gun',3,10,False),('Shotgun',3,10,False),('Pistol',-3,3,False),('Light machine gun',20,3,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'cavalry squad' in n:
                  return 'base: Cavalry Carbines', [('Submachine gun',3,3,False),('Pistol',-3,10,False),('Light machine gun',20,1,False)], None
              if 'paratrooper squad' in n:
                  return 'base: Carbines', [('Submachine gun',3,10,False),('Shotgun',3,10,False),('Pistol',-3,2,False),('Light machine gun',20,2,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'drafted squad' in n and not gw:
                  return 'base: Rifles', [('NCO submachine gun',3,1,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'partisan squad' in n:
                  lmg_max=1 if 'inexperienced' in n else 3
                  return 'base: Carbines', [('Submachine gun',3,5,False),('Shotgun',3,5,False),('Assault rifle',5,5,False),('Volta Repeater',0,5,False),('Pistol',-3,3,False),('Light machine gun',20,lmg_max,False)], None
              if 'republic rangers squad' in n and not gw:
                  return 'base: Carbines', [('Submachine gun',3,7,False),('Shotgun',3,10,False),('Assault rifle',5,10,False),('Volta Repeater',0,10,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'swords of maro squad' in n and not gw:
                  return 'base: Carbines', [('Submachine gun',3,10,False),('Shotgun',3,10,False),('Assault rifle',5,10,False),('Volta Repeater',0,10,False),('Pistol',-3,2,False),('Light machine gun',20,2,False)], None
              return None

          def ensure_groups(se):
              groups=se.find(q('selectionEntryGroups'))
              if groups is None:
                  groups=ET.Element(q('selectionEntryGroups'))
                  costs=se.find(q('costs'))
                  if costs is not None: se.insert(list(se).index(costs),groups)
                  else: se.append(groups)
              return groups

          def add_max(parent, constraint_id, value):
              cs=parent.find(q('constraints'))
              if cs is None: cs=ET.SubElement(parent,q('constraints'))
              ET.SubElement(cs,q('constraint'),{'field':'selections','scope':'parent','value':str(value),'percentValue':'false','shared':'false','includeChildSelections':'false','includeChildForces':'false','type':'max','id':constraint_id})

          cat=ET.parse('Colonial Legion.cat'); root=cat.getroot(); root.set('type','catalogue')
          weapon_added=0; size_added=0
          for se in root.findall('.//' + q('selectionEntry')):
              if se.get('type')!='unit': continue
              name=se.get('name',''); groups=ensure_groups(se)
              size=squad_size_spec(name)
              add_man_id=None
              if size:
                  base,max_extra,each_pts=size
                  sg=ET.SubElement(groups,q('selectionEntryGroup'),{'name':f'Squad Size (base {base} models)','id':sid(se.get('id'),'squad-size'),'hidden':'false'})
                  sentries=ET.SubElement(sg,q('selectionEntries'))
                  add_man_id=sid(se.get('id'),'additional-man')
                  up=ET.SubElement(sentries,q('selectionEntry'),{'type':'upgrade','import':'true','name':'Additional man','hidden':'false','id':add_man_id})
                  add_max(up,sid(se.get('id'),'additional-man','max'),max_extra)
                  costs=ET.SubElement(up,q('costs')); ET.SubElement(costs,q('cost'),{'name':'pts','typeId':POINTS,'value':str(float(each_pts))})
                  size_added+=1

              spec=weapon_spec(name)
              if not spec: continue
              label,weapons,fixed_group_max=spec
              replacements=[w for w in weapons if not w[3]]
              extras=[w for w in weapons if w[3]]

              wg=ET.SubElement(groups,q('selectionEntryGroup'),{'name':'Weapon Replacements ('+label+')','id':sid(se.get('id'),'weapons'),'hidden':'false'})
              group_constraint_id=sid(se.get('id'),'weapons','group-max')
              if fixed_group_max is not None:
                  add_max(wg,group_constraint_id,fixed_group_max)
              elif size:
                  base,max_extra,each_pts=size
                  add_max(wg,group_constraint_id,base)
                  # Dynamically increase the total number of replacement choices by one
                  # for every Additional man selected, so weapon replacements can never
                  # exceed the current squad size.
                  mods=ET.SubElement(wg,q('modifiers'))
                  mod=ET.SubElement(mods,q('modifier'),{'type':'increment','field':group_constraint_id,'value':'1'})
                  reps=ET.SubElement(mod,q('repeats'))
                  ET.SubElement(reps,q('repeat'),{'field':'selections','scope':'parent','value':'1','percentValue':'false','shared':'true','includeChildSelections':'true','includeChildForces':'false','childId':add_man_id,'repeats':'1','roundUp':'false'})
              wentries=ET.SubElement(wg,q('selectionEntries'))
              for wname,pts,maximum,_ in replacements:
                  up=ET.SubElement(wentries,q('selectionEntry'),{'type':'upgrade','import':'true','name':wname,'hidden':'false','id':sid(se.get('id'),'weapon',wname)})
                  add_max(up,sid(se.get('id'),'weapon',wname,'max'),maximum)
                  costs=ET.SubElement(up,q('costs')); ET.SubElement(costs,q('cost'),{'name':'pts','typeId':POINTS,'value':str(float(pts))})
                  weapon_added+=1

              if extras:
                  eg=ET.SubElement(groups,q('selectionEntryGroup'),{'name':'Additional Weapons','id':sid(se.get('id'),'additional-weapons'),'hidden':'false'})
                  eentries=ET.SubElement(eg,q('selectionEntries'))
                  for wname,pts,maximum,_ in extras:
                      up=ET.SubElement(eentries,q('selectionEntry'),{'type':'upgrade','import':'true','name':wname,'hidden':'false','id':sid(se.get('id'),'weapon',wname)})
                      add_max(up,sid(se.get('id'),'weapon',wname,'max'),maximum)
                      costs=ET.SubElement(up,q('costs')); ET.SubElement(costs,q('cost'),{'name':'pts','typeId':POINTS,'value':str(float(pts))})
                      weapon_added+=1

          ET.register_namespace('',CAT_NS); cat.write('Colonial Legion.cat',encoding='UTF-8',xml_declaration=True)
          gst=ET.parse('Bolt Action - Foxhole.gst'); ET.register_namespace('',GST_NS); gst.getroot().set('type','gameSystem'); gst.write('Bolt Action - Foxhole.gst',encoding='UTF-8',xml_declaration=True)
          for path in ['Colonial Legion.cat','Bolt Action - Foxhole.gst','index.xml']:
              ET.parse(path); print('XML OK:',path)
          print('Squad-size controls added:',size_added)
          print('Weapon upgrade selections added:',weapon_added)
          PY
      - name: Commit rebuilt data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Colonial Legion.cat' 'Bolt Action - Foxhole.gst'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Add squad size and dynamic weapon constraints'
            git push
          fi
