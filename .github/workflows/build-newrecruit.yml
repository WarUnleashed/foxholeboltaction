name: Build New Recruit data

on:
  workflow_dispatch:
  push:
    paths:
      - 'build/**'
      - '.github/workflows/build-newrecruit.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild BattleScribe data files
        shell: bash
        run: |
          set -euo pipefail
          cat build/min_chunks/min_00.b64 build/min_chunks/min_01.b64 build/min_chunks/min_02.b64 build/min_chunks/min_03.b64 | base64 -d | gzip -d > 'Colonial Legion.cat'
          cat build/gst.b64 | base64 -d | gzip -d > 'Bolt Action - Foxhole.gst'
          python - <<'PY'
          import copy
          import uuid
          import xml.etree.ElementTree as ET

          CAT_NS = 'http://www.battlescribe.net/schema/catalogueSchema'
          GST_NS = 'http://www.battlescribe.net/schema/gameSystemSchema'
          POINTS = 'b0e5f7a2-33c8-46ce-8f8f-148d8171da43'
          TRANSPORT_CAT = 'fc7f7f70-4bea-5d27-8b5e-cb2ac03797c7'
          TANK_CAT = '0f9945cb-0ce1-521e-8f54-35857994efd8'
          LIEUTENANT_CAT = '5b361517-ed58-5d60-a6fd-b00e15d7f574'
          CAPTAIN_MAJOR_CAT = '914d5c8b-ebd1-54ff-b0d6-23aa67ddef6a'
          ET.register_namespace('', CAT_NS)

          def q(tag):
              return f'{{{CAT_NS}}}{tag}'

          def sid(*parts):
              return str(uuid.uuid5(uuid.UUID('6ba7b810-9dad-11d1-80b4-00c04fd430c8'), 'colonial-legion|' + '|'.join(map(str, parts))))

          ARM_CMD_CAT = sid('category', 'Armoured Platoon Commander')

          def exp_from_name(n):
              s=n.lower()
              if 'inexperienced' in s: return 'Inexperienced'
              if 'veteran' in s: return 'Veteran'
              if 'regular' in s: return 'Regular'
              return None

          def is_officer_name(name):
              n=name.lower()
              return any(x in n for x in ['2nd lieutenant','1st lieutenant','captain','major'])

          def has_category(se, category_id):
              cats=se.find(q('categoryLinks'))
              return cats is not None and any(cl.get('targetId') == category_id for cl in cats.findall(q('categoryLink')))

          def squad_size_spec(name):
              n=name.lower(); gw='great war era' in n; exp=exp_from_name(n)
              if 'recruit squad' in n and gw: return (5,5,7)
              if 'regular infantry squad' in n and gw: return (5,5,10)
              if 'veteran infantry squad' in n and gw: return (5,5,13)
              if 'drafted squad' in n and gw: return (5,15,4)
              if 'republic rangers squad' in n and gw: return (2,8,15)
              if 'swords of maro squad' in n and gw: return (5,5,14)
              if 'recruit squad' in n and not gw: return (5,5,7)
              if 'regular infantry squad' in n and not gw: return (5,5,10)
              if 'veteran infantry squad' in n and not gw: return (5,5,13)
              if 'reconnaissance squad' in n: return (4,6,13 if exp=='Veteran' else 10)
              if 'engineer squad' in n: return (5,5,13)
              if 'marine squad' in n: return (5,5,13 if exp=='Veteran' else 10)
              if 'cavalry squad' in n: return (3,7,13 if exp=='Veteran' else 10)
              if 'paratrooper squad' in n: return (5,5,14)
              if 'drafted squad' in n and not gw: return (5,15,4)
              if 'partisan squad' in n: return (4,6,7 if exp=='Inexperienced' else (14 if exp=='Veteran' else 10))
              if 'republic rangers squad' in n and not gw: return (2,8,15)
              if 'swords of maro squad' in n and not gw: return (5,5,14)
              return None

          def weapon_spec(name):
              n=name.lower(); gw='great war era' in n
              officer=is_officer_name(name)
              observer='forward observer' in n
              if officer or observer: return 'choose one weapon', [('Pistol',0,1,False),('Submachine gun',0,1,False),('Carbine',0,1,False),('Shotgun',0,1,False),('Assault rifle',0,1,False),('Volta Repeater',0,1,False)], 1
              if 'medic' in n: return 'choose one weapon', [('Pistol',0,1,False),('Unarmed',0,1,False)], 1
              if 'recruit squad' in n and gw: return 'base: Carbines', [('Volta Repeater',0,10,False),('NCO submachine gun',3,1,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'regular infantry squad' in n and gw: return 'base: Carbines', [('Volta Repeater',0,10,False),('NCO submachine gun',3,1,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'veteran infantry squad' in n and gw: return 'base: Carbines', [('Volta Repeater',0,10,False),('Submachine gun',3,3,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'drafted squad' in n and gw: return 'base: Volta Repeaters', [('Carbine',0,20,False),('Light machine gun',20,1,False)], None
              if 'republic rangers squad' in n and gw: return 'base: Carbines', [('Submachine gun',3,3,False),('Shotgun',3,4,False),('Volta Repeater',0,10,False),('Pistol',-3,1,False),('Malone light machine gun',20,1,False),('Grenade launcher (alongside rifle)',20,1,True)], None
              if 'swords of maro squad' in n and gw: return 'base: Carbines', [('Submachine gun',3,3,False),('Shotgun',3,3,False),('Volta Repeater',0,10,False),('Pistol',-3,2,False),('Light machine gun',20,2,False)], None
              if 'recruit squad' in n and not gw: return 'base: Carbines', [('NCO Volta Repeater',0,1,False),('NCO submachine gun',3,1,False),('Shotgun',3,2,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'regular infantry squad' in n and not gw: return 'base: Carbines', [('Submachine gun',3,2,False),('Shotgun',3,3,False),('Volta Repeater',0,3,False),('Pistol',-3,1,False),('Light machine gun',20,1,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'veteran infantry squad' in n and not gw: return 'base: Carbines', [('Submachine gun',3,7,False),('Shotgun',3,10,False),('Volta Repeater',0,10,False),('Pistol',-3,2,False),('Light machine gun',20,2,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'reconnaissance squad' in n: return 'base: Carbines', [('Submachine gun',3,5,False),('Shotgun',3,5,False),('Assault rifle',5,3,False)], None
              if 'engineer squad' in n: return 'base: Carbines', [('Submachine gun',3,7,False),('Shotgun',3,10,False),('Assault rifle',5,7,False),('Volta Repeater',0,10,False),('Pistol',-3,2,False),('Light machine gun',20,1,False),('Flamethrower',20,1,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'marine squad' in n: return 'base: Carbines', [('Submachine gun',3,10,False),('Shotgun',3,10,False),('Pistol',-3,3,False),('Light machine gun',20,3,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'cavalry squad' in n: return 'base: Cavalry Carbines', [('Submachine gun',3,3,False),('Pistol',-3,10,False),('Light machine gun',20,1,False)], None
              if 'paratrooper squad' in n: return 'base: Carbines', [('Submachine gun',3,10,False),('Shotgun',3,10,False),('Pistol',-3,2,False),('Light machine gun',20,2,False),('Ignifist (additional weapon)',3,4,True)], None
              if 'drafted squad' in n and not gw: return 'base: Rifles', [('NCO submachine gun',3,1,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'partisan squad' in n:
                  lmg_max=1 if 'inexperienced' in n else 3
                  return 'base: Carbines', [('Submachine gun',3,5,False),('Shotgun',3,5,False),('Assault rifle',5,5,False),('Volta Repeater',0,5,False),('Pistol',-3,3,False),('Light machine gun',20,lmg_max,False)], None
              if 'republic rangers squad' in n and not gw: return 'base: Carbines', [('Submachine gun',3,7,False),('Shotgun',3,10,False),('Assault rifle',5,10,False),('Volta Repeater',0,10,False),('Pistol',-3,1,False),('Light machine gun',20,1,False)], None
              if 'swords of maro squad' in n and not gw: return 'base: Carbines', [('Submachine gun',3,10,False),('Shotgun',3,10,False),('Assault rifle',5,10,False),('Volta Repeater',0,10,False),('Pistol',-3,2,False),('Light machine gun',20,2,False)], None
              return None

          def ensure_groups(se):
              groups=se.find(q('selectionEntryGroups'))
              if groups is None:
                  groups=ET.Element(q('selectionEntryGroups'))
                  costs=se.find(q('costs'))
                  if costs is not None: se.insert(list(se).index(costs),groups)
                  else: se.append(groups)
              return groups

          def add_max(parent, constraint_id, value):
              cs=parent.find(q('constraints'))
              if cs is None: cs=ET.SubElement(parent,q('constraints'))
              ET.SubElement(cs,q('constraint'),{'field':'selections','scope':'parent','value':str(value),'percentValue':'false','shared':'false','includeChildSelections':'false','includeChildForces':'false','type':'max','id':constraint_id})

          cat=ET.parse('Colonial Legion.cat'); root=cat.getroot(); root.set('type','catalogue')
          top_entries=root.find(q('selectionEntries'))

          # Create Armoured-Platoon-only officer copies. They deliberately do not retain the
          # regular Lieutenant/Captain categories, so they cannot appear in infantry or
          # mechanized selectors. The ordinary officer entries remain unchanged.
          armoured_commanders_added=0
          if top_entries is not None:
              officer_sources=[]
              for se in top_entries.findall(q('selectionEntry')):
                  if se.get('type') != 'unit': continue
                  if has_category(se,LIEUTENANT_CAT) or has_category(se,CAPTAIN_MAJOR_CAT):
                      officer_sources.append(se)
              for source in officer_sources:
                  clone=copy.deepcopy(source)
                  source_id=source.get('id')
                  for elem in clone.iter():
                      if elem.get('id'):
                          elem.set('id',sid('armoured-commander',source_id,elem.get('id')))
                  clone.set('id',sid('armoured-commander',source_id))
                  clone.set('name',source.get('name','Officer') + ' — Armoured Commander')
                  cats=clone.find(q('categoryLinks'))
                  if cats is None: cats=ET.SubElement(clone,q('categoryLinks'))
                  else:
                      for child in list(cats): cats.remove(child)
                  ET.SubElement(cats,q('categoryLink'),{
                      'id':sid('armoured-commander',source_id,'category'),
                      'name':'Armoured Platoon Commander','hidden':'false',
                      'targetId':ARM_CMD_CAT,'primary':'true'
                  })
                  top_entries.append(clone)
                  armoured_commanders_added += 1

          transport_entries=[]; tank_entries=[]
          if top_entries is not None:
              for tse in top_entries.findall(q('selectionEntry')):
                  cats=tse.find(q('categoryLinks'))
                  if cats is None: continue
                  targets={cl.get('targetId') for cl in cats.findall(q('categoryLink'))}
                  item=(tse.get('id'),tse.get('name',''),exp_from_name(tse.get('name','')))
                  if TRANSPORT_CAT in targets: transport_entries.append(item)
                  if TANK_CAT in targets: tank_entries.append(item)

          weapon_added=0; size_added=0; sticky_added=0; transport_groups_added=0; command_vehicle_groups_added=0
          for se in root.findall('.//' + q('selectionEntry')):
              if se.get('type')!='unit': continue
              name=se.get('name',''); groups=ensure_groups(se)
              size=squad_size_spec(name); add_man_id=None
              if size:
                  base,max_extra,each_pts=size
                  sg=ET.SubElement(groups,q('selectionEntryGroup'),{'name':f'Squad Size (base {base} models)','id':sid(se.get('id'),'squad-size'),'hidden':'false'})
                  sentries=ET.SubElement(sg,q('selectionEntries')); add_man_id=sid(se.get('id'),'additional-man')
                  up=ET.SubElement(sentries,q('selectionEntry'),{'type':'upgrade','import':'true','name':'Additional man','hidden':'false','id':add_man_id})
                  add_max(up,sid(se.get('id'),'additional-man','max'),max_extra)
                  costs=ET.SubElement(up,q('costs')); ET.SubElement(costs,q('cost'),{'name':'pts','typeId':POINTS,'value':str(float(each_pts))}); size_added+=1

                  tg=ET.SubElement(groups,q('selectionEntryGroup'),{'name':'Attached Transport / Tow','id':sid(se.get('id'),'attached-transport'),'hidden':'false'})
                  add_max(tg,sid(se.get('id'),'attached-transport','max'),1)
                  links=ET.SubElement(tg,q('entryLinks'))
                  squad_exp=exp_from_name(name)
                  linked=0
                  for target_id,target_name,target_exp in transport_entries:
                      if squad_exp and target_exp and squad_exp != target_exp: continue
                      link=ET.SubElement(links,q('entryLink'),{'id':sid(se.get('id'),'transport',target_id),'name':target_name,'hidden':'false','collective':'false','import':'true','targetId':target_id,'type':'selectionEntry'})
                      add_max(link,sid(se.get('id'),'transport',target_id,'max'),1)
                      linked+=1
                  if linked: transport_groups_added+=1

              # Only the dedicated Armoured Platoon Commander copies get a command tank.
              if has_category(se,ARM_CMD_CAT):
                  cg=ET.SubElement(groups,q('selectionEntryGroup'),{'name':'Command Tank / SPG','id':sid(se.get('id'),'command-vehicle'),'hidden':'false'})
                  add_max(cg,sid(se.get('id'),'command-vehicle','max'),1)
                  links=ET.SubElement(cg,q('entryLinks'))
                  officer_exp=exp_from_name(name); linked=0
                  for target_id,target_name,target_exp in tank_entries:
                      if officer_exp and target_exp and officer_exp != target_exp: continue
                      link=ET.SubElement(links,q('entryLink'),{'id':sid(se.get('id'),'command-vehicle',target_id),'name':target_name,'hidden':'false','collective':'false','import':'true','targetId':target_id,'type':'selectionEntry'})
                      add_max(link,sid(se.get('id'),'command-vehicle',target_id,'max'),1)
                      linked+=1
                  if linked: command_vehicle_groups_added+=1

              spec=weapon_spec(name)
              if not spec: continue
              label,weapons,fixed_group_max=spec; replacements=[w for w in weapons if not w[3]]; extras=[w for w in weapons if w[3]]
              wg=ET.SubElement(groups,q('selectionEntryGroup'),{'name':'Weapon Replacements ('+label+')','id':sid(se.get('id'),'weapons'),'hidden':'false'})
              group_constraint_id=sid(se.get('id'),'weapons','group-max')
              if fixed_group_max is not None: add_max(wg,group_constraint_id,fixed_group_max)
              elif size:
                  base,max_extra,each_pts=size; add_max(wg,group_constraint_id,base)
                  mods=ET.SubElement(wg,q('modifiers')); mod=ET.SubElement(mods,q('modifier'),{'type':'increment','field':group_constraint_id,'value':'1'}); reps=ET.SubElement(mod,q('repeats'))
                  ET.SubElement(reps,q('repeat'),{'field':'selections','scope':'parent','value':'1','percentValue':'false','shared':'true','includeChildSelections':'true','includeChildForces':'false','childId':add_man_id,'repeats':'1','roundUp':'false'})
              wentries=ET.SubElement(wg,q('selectionEntries'))
              for wname,pts,maximum,_ in replacements:
                  up=ET.SubElement(wentries,q('selectionEntry'),{'type':'upgrade','import':'true','name':wname,'hidden':'false','id':sid(se.get('id'),'weapon',wname)}); add_max(up,sid(se.get('id'),'weapon',wname,'max'),maximum)
                  costs=ET.SubElement(up,q('costs')); ET.SubElement(costs,q('cost'),{'name':'pts','typeId':POINTS,'value':str(float(pts))}); weapon_added+=1
              if extras:
                  eg=ET.SubElement(groups,q('selectionEntryGroup'),{'name':'Additional Weapons','id':sid(se.get('id'),'additional-weapons'),'hidden':'false'}); eentries=ET.SubElement(eg,q('selectionEntries'))
                  for wname,pts,maximum,_ in extras:
                      up=ET.SubElement(eentries,q('selectionEntry'),{'type':'upgrade','import':'true','name':wname,'hidden':'false','id':sid(se.get('id'),'weapon',wname)}); add_max(up,sid(se.get('id'),'weapon',wname,'max'),maximum)
                      costs=ET.SubElement(up,q('costs')); ET.SubElement(costs,q('cost'),{'name':'pts','typeId':POINTS,'value':str(float(pts))}); weapon_added+=1

              if size and any(w[0].startswith('Ignifist') for w in extras):
                  base,max_extra,each_pts=size
                  eq=ET.SubElement(groups,q('selectionEntryGroup'),{'name':'Squad Equipment','id':sid(se.get('id'),'squad-equipment'),'hidden':'false'})
                  eq_entries=ET.SubElement(eq,q('selectionEntries'))
                  sticky=ET.SubElement(eq_entries,q('selectionEntry'),{'type':'upgrade','import':'true','name':'Sticky grenades (whole squad)','hidden':'false','id':sid(se.get('id'),'sticky-grenades')})
                  add_max(sticky,sid(se.get('id'),'sticky-grenades','max'),1)
                  costs=ET.SubElement(sticky,q('costs')); ET.SubElement(costs,q('cost'),{'name':'pts','typeId':POINTS,'value':str(float(base*2))})
                  if add_man_id:
                      mods=ET.SubElement(sticky,q('modifiers')); mod=ET.SubElement(mods,q('modifier'),{'type':'increment','field':POINTS,'value':'2'}); reps=ET.SubElement(mod,q('repeats'))
                      ET.SubElement(reps,q('repeat'),{'field':'selections','scope':'parent','value':'1','percentValue':'false','shared':'true','includeChildSelections':'true','includeChildForces':'false','childId':add_man_id,'repeats':'1','roundUp':'false'})
                  sticky_added+=1

          ET.register_namespace('',CAT_NS); cat.write('Colonial Legion.cat',encoding='UTF-8',xml_declaration=True)

          gst=ET.parse('Bolt Action - Foxhole.gst'); ET.register_namespace('',GST_NS); gst_root=gst.getroot(); gst_root.set('type','gameSystem')
          def gq(tag): return f'{{{GST_NS}}}{tag}'
          def child_local(root,name): return next((c for c in root if c.tag.rsplit('}',1)[-1]==name),None)

          # Add the armoured-command category to the game system so only the Armoured
          # Platoon selector exposes the cloned commander entries.
          category_entries=child_local(gst_root,'categoryEntries')
          if category_entries is None:
              category_entries=ET.Element(gq('categoryEntries'))
              force_entries_existing=child_local(gst_root,'forceEntries')
              if force_entries_existing is not None: gst_root.insert(list(gst_root).index(force_entries_existing),category_entries)
              else: gst_root.append(category_entries)
          if not any(c.get('id')==ARM_CMD_CAT for c in list(category_entries)):
              ET.SubElement(category_entries,gq('categoryEntry'),{'id':ARM_CMD_CAT,'name':'Armoured Platoon Commander','hidden':'false'})

          categories={'Armoured Platoon Commander':ARM_CMD_CAT,'Lieutenant':LIEUTENANT_CAT,'Captain / Major':CAPTAIN_MAJOR_CAT,'Medic':'4e0b9e1a-0360-51cc-a506-097a7efcd44e','Forward Observer':'43e65105-60f7-5bb6-a4ac-02a433a791ee','Infantry Squad':'1db0d511-ab38-5eb8-afa7-97cd18cf7d11','Machine Gun Team':'df95158d-692a-545b-b6da-9fc45eb1f7fa','Mortar Team':'f8cf368a-5e9a-5d56-8e8f-5a5e9a7977b4','Sniper Team':'62025d03-4255-56ea-870e-c3399170789d','Anti-Tank Team':'3cf48c43-9058-564e-901a-e3098be16d2f','Field / Emplaced / Immobile Weapon':'75cd78ea-f7b0-5366-b2b5-cfcaa6ba2fc6','Armoured Car':'6e1678b3-02f8-5430-9f5b-e3da292b8625','Tank / SPG':TANK_CAT,'Transport / Tow':TRANSPORT_CAT}

          pdf_army_rules={
              'Close Air Support':'A Colonial Forward Air Observer may call an Air Strike twice per game. Resolve the first normally; after it is resolved the observer may call the second. Rookie pilot results on the Air Strike chart may be re-rolled.',
              'March of the Legion':'The Colonial Argenti r.II is treated as a carbine. Almost all Colonial infantry squads use carbines as their base weapon, and this is a free upgrade.',
              'Faith in Armour':'Colonial infantry and artillery within 6 inches of, or being transported or towed by, a friendly vehicle with Damage Value 8+ gain +1 morale. This does not stack from multiple vehicles, but can stack with similar bonuses. Whenever a friendly Colonial DV 8+ vehicle is destroyed, friendly infantry and artillery within 6 inches must take a morale test; on a failure they suffer 1 pin.',
              'Meticulous Assault (Great War Era)':'Great War Era only. Colonial units ignore the -1 morale penalty on order tests to enter from reserve. Units that outflank may deploy 12 inches farther along their table edge than normal.',
              'Inspiring Courage (Modern Era)':'Modern Era only. When a Green Colonial unit is upgraded from Inexperienced to Regular after taking a casualty, it gives +1 morale to Inexperienced Green units within 12 inches. This bonus does not stack. A Green unit within 12 inches of a previously upgraded unit becomes Regular on a 4, 5, or 6 when checking for its Green upgrade.',
              'Armoured Platoon':'Custom Armoured Platoon selector for this data set. Choose exactly one Armoured Platoon Commander using the normal Colonial officer ranks and experience levels. That commander may attach one matching-experience Tank / SPG as the command vehicle. The command vehicle counts toward the platoon total. The platoon requires at least one Infantry Squad and a total of three to six Tank / SPG selections.'
          }
          rules=child_local(gst_root,'sharedRules')
          if rules is None: rules=ET.SubElement(gst_root,gq('sharedRules'))
          existing_rule_ids={r.get('name'):r.get('id') for r in list(rules)}
          rule_ids={}
          for rule_name,description in pdf_army_rules.items():
              rule_id=existing_rule_ids.get(rule_name) or sid('rule',rule_name)
              rule_ids[rule_name]=rule_id
              existing_rule=next((r for r in list(rules) if r.get('name')==rule_name),None)
              if existing_rule is None:
                  r=ET.SubElement(rules,gq('rule'),{'id':rule_id,'name':rule_name,'hidden':'false'})
                  d=ET.SubElement(r,gq('description')); d.text=description
              else:
                  d=next((c for c in existing_rule if c.tag.rsplit('}',1)[-1]=='description'),None)
                  if d is None: d=ET.SubElement(existing_rule,gq('description'))
                  d.text=description

          def add_force(name,limits,info_rule_names=None):
              force_entries=child_local(gst_root,'forceEntries')
              if force_entries is None:
                  force_entries=ET.Element(gq('forceEntries')); shared=child_local(gst_root,'sharedRules')
                  if shared is not None: gst_root.insert(list(gst_root).index(shared),force_entries)
                  else: gst_root.append(force_entries)
              fe=next((x for x in list(force_entries) if x.get('name')==name),None)
              if fe is None:
                  fe=ET.SubElement(force_entries,gq('forceEntry'),{'id':sid('force',name),'name':name,'hidden':'false'})
              else:
                  for c in list(fe):
                      if c.tag.rsplit('}',1)[-1] in ('categoryLinks','infoLinks'): fe.remove(c)
              cls=ET.SubElement(fe,gq('categoryLinks'))
              for cat_name,min_v,max_v in limits:
                  cl=ET.SubElement(cls,gq('categoryLink'),{'id':sid('force',name,cat_name),'name':cat_name,'hidden':'false','targetId':categories[cat_name],'primary':'false'})
                  if min_v is None and max_v is None: continue
                  cs=ET.SubElement(cl,gq('constraints'))
                  if min_v is not None: ET.SubElement(cs,gq('constraint'),{'field':'selections','scope':'force','value':str(min_v),'percentValue':'false','shared':'false','includeChildSelections':'true','includeChildForces':'false','type':'min','id':sid('force',name,cat_name,'min')})
                  if max_v is not None: ET.SubElement(cs,gq('constraint'),{'field':'selections','scope':'force','value':str(max_v),'percentValue':'false','shared':'false','includeChildSelections':'true','includeChildForces':'false','type':'max','id':sid('force',name,cat_name,'max')})
              if info_rule_names:
                  ils=ET.SubElement(fe,gq('infoLinks'))
                  for rn in info_rule_names:
                      ET.SubElement(ils,gq('infoLink'),{'id':sid('force',name,'rule',rn),'name':rn,'hidden':'false','targetId':rule_ids[rn],'type':'rule'})
              return fe

