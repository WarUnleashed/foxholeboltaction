name: Build New Recruit data

on:
  workflow_dispatch:
  push:
    paths:
      - 'build/**'
      - '.github/workflows/build-newrecruit.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild BattleScribe data files
        shell: bash
        run: |
          set -euo pipefail
          cat build/min_chunks/min_00.b64 build/min_chunks/min_01.b64 build/min_chunks/min_02.b64 build/min_chunks/min_03.b64 | base64 -d | gzip -d > 'Colonial Legion.cat'
          cat build/gst.b64 | base64 -d | gzip -d > 'Bolt Action - Foxhole.gst'
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ['Colonial Legion.cat', 'Bolt Action - Foxhole.gst', 'index.xml']:
              ET.parse(path)
              print('XML OK:', path)
          PY
      - name: Commit rebuilt data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Colonial Legion.cat' 'Bolt Action - Foxhole.gst'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build compatible New Recruit data files'
            git push
          fi
