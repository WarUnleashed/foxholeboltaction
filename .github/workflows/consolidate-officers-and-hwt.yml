name: Consolidate HQ and Heavy Weapons Team limits

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/consolidate-officers-and-hwt.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix HQ selector order and remove obsolete emplaced weapons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import uuid
          import xml.etree.ElementTree as ET

          CAT_NS='http://www.battlescribe.net/schema/catalogueSchema'
          GST_NS='http://www.battlescribe.net/schema/gameSystemSchema'
          IDX_NS='http://www.battlescribe.net/schema/dataIndexSchema'
          REV='11'
          LT='5b361517-ed58-5d60-a6fd-b00e15d7f574'
          CAP='914d5c8b-ebd1-54ff-b0d6-23aa67ddef6a'
          MED='4e0b9e1a-0360-51cc-a506-097a7efcd44e'
          HWT='df95158d-692a-545b-b6da-9fc45eb1f7fa'
          ARM_CMD='5a76adff-513b-5d97-a775-aba4be508203'
          HQ='0a8d85ef-5eb7-5d82-b0fa-4b65fa8b16c9'

          def q(ns,tag): return f'{{{ns}}}{tag}'
          def lname(tag): return tag.rsplit('}',1)[-1]
          def child(parent,name): return next((x for x in parent if lname(x.tag)==name),None)
          def ensure(parent,ns,name):
              x=child(parent,name)
              if x is None: x=ET.SubElement(parent,q(ns,name))
              return x
          def sid(*parts):
              return str(uuid.uuid5(uuid.UUID('6ba7b810-9dad-11d1-80b4-00c04fd430c8'),'foxhole-hq|'+'|'.join(map(str,parts))))
          def norm(s): return re.sub(r'[^a-z0-9]+',' ',(s or '').lower()).strip()
          def has_cat(se,cid):
              cs=child(se,'categoryLinks')
              return cs is not None and any(x.get('targetId')==cid for x in cs)
          def add_cat(se,cid,name,primary=False):
              cs=ensure(se,CAT_NS,'categoryLinks')
              for cl in cs:
                  if cl.get('targetId')==cid:
                      cl.set('name',name); cl.set('primary','true' if primary else 'false'); return cl
              return ET.SubElement(cs,q(CAT_NS,'categoryLink'),{
                  'id':sid(se.get('id'),cid),'name':name,'hidden':'false','targetId':cid,
                  'primary':'true' if primary else 'false'})
          def set_constraint(cl,ctype,value):
              cs=child(cl,'constraints')
              if cs is None: cs=ET.SubElement(cl,q(CAT_NS,'constraints'))
              found=False
              for c in cs:
                  if lname(c.tag)=='constraint' and c.get('type')==ctype:
                      c.set('value',str(value)); found=True
              if not found:
                  ET.SubElement(cs,q(CAT_NS,'constraint'),{
                      'field':'selections','scope':'force','value':str(value),'percentValue':'false','shared':'false',
                      'includeChildSelections':'true','includeChildForces':'false','type':ctype,'id':sid(cl.get('id'),ctype)})
          def top_entries(root):
              for cname in ('selectionEntries','sharedSelectionEntries'):
                  c=child(root,cname)
                  if c is not None:
                      for se in list(c):
                          if lname(se.tag)=='selectionEntry': yield c,se
          def remove_links_to(root,ids):
              if not ids: return
              parents={c:p for p in root.iter() for c in p}
              for link in list(root.iter(q(CAT_NS,'entryLink'))):
                  if link.get('targetId') in ids:
                      p=parents.get(link)
                      if p is not None: p.remove(link)

          def process_cat(path,colonial=False):
              ET.register_namespace('',CAT_NS)
              tree=ET.parse(path); root=tree.getroot()

              # Lieutenant, Captain/Major and Medic all live under the single visible HQ category.
              for se in root.iter(q(CAT_NS,'selectionEntry')):
                  if se.get('type')!='unit': continue
                  if any(has_cat(se,cid) for cid in (LT,CAP,MED)):
                      cs=child(se,'categoryLinks')
                      for cl in cs:
                          if cl.get('targetId') in (LT,CAP,MED):
                              cl.set('primary','false')
                      add_cat(se,HQ,'HQ',True)

              for force in root.iter(q(CAT_NS,'forceEntry')):
                  cats=child(force,'categoryLinks')
                  if cats is None: continue

                  # Keep the dedicated armoured commander structure untouched.
                  is_armoured=any(cl.get('targetId')==ARM_CMD for cl in cats)

                  # Heavy Weapons Teams: up to two.
                  for cl in cats:
                      if cl.get('targetId')==HWT:
                          cl.set('name','Heavy Weapons Team'); set_constraint(cl,'max',2)

                  if not is_armoured and any(cl.get('targetId') in (LT,CAP,MED,HQ) for cl in cats):
                      # Hide the old individual selector headings but retain their max constraints.
                      for cl in cats:
                          if cl.get('targetId') in (LT,CAP,MED): cl.set('hidden','true')

                      hq=next((cl for cl in cats if cl.get('targetId')==HQ),None)
                      if hq is None:
                          hq=ET.Element(q(CAT_NS,'categoryLink'),{
                              'id':sid(force.get('id'),'hq-visible'),'name':'HQ','hidden':'false',
                              'targetId':HQ,'primary':'false'})
                      else:
                          cats.remove(hq)
                          hq.set('name','HQ'); hq.set('hidden','false')

                      # HQ must be selected and must appear first in New Recruit.
                      set_constraint(hq,'min',1)
                      set_constraint(hq,'max',3)
                      cats.insert(0,hq)

              # Remove the obsolete Colonial generic/emplaced weapon placeholders completely.
              if colonial:
                  remove_ids=set()
                  for container,se in list(top_entries(root)):
                      n=norm(se.get('name'))
                      if ('coastal gun' in n or 'emplacement mortar' in n or
                          'static artillery' in n or 'howitzer' in n):
                          remove_ids.add(se.get('id')); container.remove(se)
                  remove_links_to(root,remove_ids)
                  print('Removed obsolete Colonial field/emplaced entries:',len(remove_ids))

              root.set('revision',REV); root.set('gameSystemRevision',REV)
              tree.write(path,encoding='UTF-8',xml_declaration=True)

          process_cat('Colonial Legion.cat',colonial=True)
          process_cat('Warden Army.cat',colonial=False)

          ET.register_namespace('',GST_NS)
          gst=ET.parse('Bolt Action - Foxhole.gst'); g=gst.getroot()
          cats=child(g,'categoryEntries')
          if cats is None: cats=ET.SubElement(g,q(GST_NS,'categoryEntries'))
          ce=next((x for x in cats if lname(x.tag)=='categoryEntry' and x.get('id')==HQ),None)
          if ce is None:
              ce=ET.SubElement(cats,q(GST_NS,'categoryEntry'),{'id':HQ,'name':'HQ','hidden':'false'})
          else:
              ce.set('name','HQ'); ce.set('hidden','false')
          g.set('revision',REV)
          gst.write('Bolt Action - Foxhole.gst',encoding='UTF-8',xml_declaration=True)

          ET.register_namespace('',IDX_NS)
          idx=ET.parse('index.xml'); ir=idx.getroot()
          for el in ir.iter():
              if lname(el.tag)=='dataIndexEntry': el.set('dataRevision',REV)
          idx.write('index.xml',encoding='UTF-8',xml_declaration=True)

          for p in ('Colonial Legion.cat','Warden Army.cat','Bolt Action - Foxhole.gst','index.xml'):
              ET.parse(p)
          PY
      - name: Commit generated selector updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Colonial Legion.cat' 'Warden Army.cat' 'Bolt Action - Foxhole.gst' index.xml
          if git diff --cached --quiet; then
            echo 'No selector changes needed.'
            exit 0
          fi
          git commit -m 'Fix HQ selector and remove obsolete emplaced weapons'
          git push
